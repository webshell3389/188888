<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>企业数据安全运维</title>
    <style>
      html, body, #app { height: 100%; margin: 0; }
      #boot-mask {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        flex-direction: column; gap: 14px; background: #0b0f17; color: #7d8ba3;
        font: 13px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      }
      #boot-mask .ring {
        width: 34px; height: 34px; border-radius: 50%;
        border: 2px solid rgba(64, 158, 255, .25); border-top-color: #409eff;
        animation: boot-spin .8s linear infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="boot-mask"><div class="ring"></div><div>正在加载…</div></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
